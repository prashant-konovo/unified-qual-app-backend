name: Backend CI/CD

on:
  push:
    branches: [data-qa, main, develop]
  pull_request:
    branches: [data-qa, main, develop]

env:
  ECR_REPOSITORY: unified-qual-api
  AWS_REGION: us-east-2
  EKS_CLUSTER: eks-cluster-apps-use2-konovo-dev
  K8S_NAMESPACE: unified-qual
  K8S_DEPLOYMENT: unified-qual-api

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Tidy modules
        run: go mod tidy
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Unit Tests
        run: go test -race -coverprofile=coverage.out ./...

  build-push:
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push
        id: build
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: prashant-konovo/qual-gitops
          ref: data-qa
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
      - name: Update image tag in values
        run: |
          IMAGE_TAG=${{ github.sha }}
          cd gitops
          sed -i "s|tag: .*|tag: \"${IMAGE_TAG}\"|" envs/konovo-dev/us-east-2/unified-qual-api-values.yaml
          echo "Updated image tag to ${IMAGE_TAG}"
          grep 'tag:' envs/konovo-dev/us-east-2/unified-qual-api-values.yaml
      - name: Commit and push
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add envs/konovo-dev/us-east-2/unified-qual-api-values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update unified-qual-api image to ${{ github.sha }}"
          git push origin data-qa
