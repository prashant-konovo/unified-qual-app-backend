name: Backend CI/CD

on:
  push:
    branches: [data-qa, main, develop]
  pull_request:
    branches: [data-qa, main, develop]

env:
  ECR_REPOSITORY: unified-qual-api
  AWS_REGION: us-east-2
  EKS_CLUSTER: eks-cluster-apps-use2-konovo-dev
  K8S_NAMESPACE: unified-qual
  K8S_DEPLOYMENT: unified-qual-api

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
      - name: Unit Tests
        run: go test -race -coverprofile=coverage.out ./...

  build-push:
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push
        id: build
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} --role-arn arn:aws:iam::631543112504:role/eks-admin-apps-use2-konovo-dev
      - name: Deploy to EKS
        run: |
          IMAGE=${{ needs.build-push.outputs.image }}
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            api=$IMAGE -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s
